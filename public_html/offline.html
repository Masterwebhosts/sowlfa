<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ffffff">

    <title>SOWLFA - غير متصل</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #1f2937;
        }

        .offline {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .offline img {
            width: 96px;
            height: 96px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            line-height: 1.7;
            color: #6b7280;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #111827;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <main class="offline">
        <img src="/icons/icon-192.png" alt="SOWLFA">

        <h1>أنت غير متصل بالإنترنت</h1>

        <p>
            يبدو أن اتصال الإنترنت غير متاح حاليًا.
            تحقق من الاتصال وحاول مرة أخرى.
        </p>

        <button onclick="location.reload()">
            إعادة المحاولة
        </button>
    </main>

</body>
</html>
